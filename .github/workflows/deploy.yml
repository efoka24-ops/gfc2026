name: Deploy to Camoo via FTP

# DECLENCHEMENT MANUEL UNIQUEMENT (workflow_dispatch).
#
# L auto-deploiement sur push a ete retire volontairement le 2026-09-02 :
#   - il pointait sur la branche `main`, qui contient un ancien code sans
#     rapport avec cette application ;
#   - le .env genere ci-dessous doit correspondre EXACTEMENT a la base et aux
#     secrets du serveur (DB trugro9159_gfc2026, APP_KEY, FTP_PASSWORD, PUSHER),
#     sinon config:cache fige de mauvais identifiants et casse la prod ;
#   - le miroir FTP peut supprimer des fichiers du serveur absents du depot
#     (ex. /dashboard, /mobile) — a verifier avant tout lancement.
#
# Avant de lancer ce workflow : verifier les secrets GitHub et tester d abord
# sur un environnement de recette. Le deploiement courant se fait par FTP
# direct, fichier par fichier.
on:
  workflow_dispatch:

jobs:
  # ── Build Laravel (backend) ──────────────────────────────────
  build-api:
    name: Build API (Laravel 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, mbstring, openssl, fileinfo, tokenizer, xml, ctype, curl, zip

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Copy .env from secrets
        run: |
          cat > .env << 'EOF'
          APP_NAME="GFC Championnat"
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=https://${{ secrets.APP_DOMAIN }}

          DB_CONNECTION=mysql
          DB_HOST=localhost
          DB_PORT=3306
          DB_DATABASE=trugro9159_gfc2026
          DB_USERNAME=trugro9159_gfc2026
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          CACHE_DRIVER=file
          SESSION_DRIVER=file
          QUEUE_CONNECTION=sync

          BROADCAST_DRIVER=pusher
          PUSHER_APP_ID=${{ secrets.PUSHER_APP_ID }}
          PUSHER_APP_KEY=${{ secrets.PUSHER_APP_KEY }}
          PUSHER_APP_SECRET=${{ secrets.PUSHER_APP_SECRET }}
          PUSHER_APP_CLUSTER=${{ secrets.PUSHER_APP_CLUSTER }}
          EOF

      - name: Generate APP_KEY if missing
        run: php artisan key:generate --force

      - name: Optimize Laravel
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Upload API to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp-12.camoo.net
          port: 21
          username: trugro9159_gfc
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: api/
          server-dir: /home/trugro9159/gfc/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/tests/**
            **/storage/logs/**

  # ── Build React Web ──────────────────────────────────────────
  build-web:
    name: Build Web (React + Vite)
    runs-on: ubuntu-latest
    needs: build-api
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build
        env:
          VITE_API_URL: https://${{ secrets.APP_DOMAIN }}/api
          VITE_PUSHER_KEY: ${{ secrets.PUSHER_APP_KEY }}
          VITE_PUSHER_CLUSTER: ${{ secrets.PUSHER_APP_CLUSTER }}
        run: npm run build

      - name: Upload web build to FTP (public/web subfolder)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp-12.camoo.net
          port: 21
          username: trugro9159_gfc
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: web/dist/
          server-dir: /home/trugro9159/gfc/public/app/
          exclude: |
            **/.git*
