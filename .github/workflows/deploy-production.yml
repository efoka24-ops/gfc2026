name: Deploy GFC 2026 to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy to CAMOO Hosting
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🔧 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_mysql
          tools: composer:v2
          
      - name: 📦 Install Composer dependencies
        working-directory: ./api
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
          
      - name: 📦 Install npm dependencies
        working-directory: ./web
        run: npm ci
        
      - name: 🏗️ Build web dashboard
        working-directory: ./web
        env:
          VITE_API_URL: http://gfc.trugroup.cm/api
        run: npm run build
        
      - name: 📁 Prepare deployment files
        run: |
          mkdir -p deploy-package
          
          # Copier fichiers API essentiels
          rsync -av --exclude='vendor' --exclude='node_modules' --exclude='.git' --exclude='tests' \
            api/app \
            api/bootstrap \
            api/config \
            api/database \
            api/public \
            api/resources \
            api/routes \
            api/storage \
            api/artisan \
            api/composer.json \
            api/composer.lock \
            deploy-package/
          
          # Copier vendor (déjà optimisé)
          cp -r api/vendor deploy-package/vendor
          
          # Créer .env depuis .env.production
          if [ -f api/.env.production ]; then
            cp api/.env.production deploy-package/.env
          fi
          
          # Copier dashboard web compilé
          mkdir -p deploy-package/public/dashboard
          cp -r web/dist/* deploy-package/public/dashboard/
          
          # Copier script d'installation
          if [ -f setup-web.php ]; then
            cp setup-web.php deploy-package/
          fi
          
      - name: 📤 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp-12.camoo.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-package/
          server-dir: /home/trugro9159/public_html/gfc/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/.env.example
            
      - name: 🔄 Run migrations via webhook
        run: |
          # Appeler un webhook pour exécuter les migrations sur le serveur
          # (Nécessite un endpoint sur le serveur)
          curl -X POST http://gfc.trugroup.cm/deploy-webhook.php \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
            -d "action=full" || true
            
      - name: ✅ Deployment complete
        run: |
          echo "🎉 Déploiement terminé avec succès!"
          echo "🌐 Dashboard: http://gfc.trugroup.cm/dashboard"
          echo "🔗 API: http://gfc.trugroup.cm/api"
